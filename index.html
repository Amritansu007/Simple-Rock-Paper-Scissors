<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <meta name="description" content="A simple Rock Paper Scissors game against the computer. First to 5 wins!">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Rock Paper Scissors</h1>
  <p class="subtitle">First to <span id="target-display">5</span> wins!</p>

  <!-- Scoreboard -->
  <div class="scoreboard">
    <div class="score-card">
      <span class="score-label">You</span>
      <span class="score-value" id="player-score">0</span>
    </div>
    <div class="score-divider">—</div>
    <div class="score-card">
      <span class="score-label">Computer</span>
      <span class="score-value" id="computer-score">0</span>
    </div>
  </div>

  <!-- Choice buttons -->
  <div class="choices" id="choices">
    <button class="choice-btn" data-choice="rock">🪨 Rock</button>
    <button class="choice-btn" data-choice="paper">📄 Paper</button>
    <button class="choice-btn" data-choice="scissors">✂️ Scissors</button>
  </div>

  <!-- Round result -->
  <div class="result" id="result">
    <p id="round-picks">Pick rock, paper, or scissors to start!</p>
    <p id="round-outcome"></p>
  </div>

  <!-- Final game-over message -->
  <div class="game-over" id="game-over"></div>

  <!-- Reset button -->
  <button class="reset-btn" id="reset-btn">Play Again / Reset</button>

  <script src="script.js"></script>
</body>
</html>
